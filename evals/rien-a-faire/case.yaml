schema_version: "1.0"
name: rien-a-faire
description: Quand rien n'est attendu du PM, le message finit par « Rien à faire de ton côté. » et ne pose aucune question.
tags: [format-reponses]
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: []
  prompt: |
    Remets ce paragraphe en trois puces courtes, sans rien ajouter :
    « L'atelier de mardi a validé le périmètre du lot 2. La maquette de l'écran d'accueil est à reprendre par l'équipe design avant vendredi. La prochaine réunion de suivi a lieu jeudi à 10 h avec le sponsor. »
runs: 1
graders:
  - name: rien-a-faire
    type: regex
    pattern: "Rien à faire de ton côté\\."
    match: contains
  - name: pas-a-trancher
    type: regex
    pattern: "À trancher"
    match: not_contains
  - name: fin-et-sans-question
    type: llm
    criteria: |
      PASS si le message donne les trois puces, finit par la ligne « Rien à faire de ton côté. » (rien d'important après), et ne pose aucune question au PM, ni n'en propose sous forme de question (« veux-tu… ? »). Une ligne « Possible ensuite : … » sans point d'interrogation est permise.
      FAIL si la ligne manque ou n'est pas à la fin, ou si le message pose une question.
